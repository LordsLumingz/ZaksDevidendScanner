name: Debug scan (temporary)
on:
  push:
    branches: [debug-scan]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .cache/fundamentals
          key: fundamentals-${{ steps.week.outputs.week }}
          restore-keys: fundamentals-
      - run: python -m scanner.pipeline --history /tmp/hist
      - run: |
          git config user.name "dividend-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/data/scan.json
          git commit -m "debug scan output [skip ci]"
          git push origin HEAD:debug-scan
